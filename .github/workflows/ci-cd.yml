name: CI/CD Pipeline

on:
  push:
    branches: [ main, sprint-4, develop ]
  pull_request:
    branches: [ main, sprint-4, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: codeacademy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Ensure 'packaging' is available to avoid resolver conflicts on the runner
        python -m pip install packaging
        pip install -r requirements.txt
        # Install only test-related dev packages to avoid dependency resolver conflicts
        pip install pytest pytest-django pytest-cov factory-boy freezegun

    - name: Run tests with coverage
      env:
        DEBUG: 'False'
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codeacademy
        DB_NAME: codeacademy
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key-do-not-use-in-production
        DJANGO_SETTINGS_MODULE: config.settings
      run: |
        pytest --cov=app app/ --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy django-stubs

    - name: Format check with Black
      run: black app/ --check --diff
      continue-on-error: true

    - name: Import sort check
      run: isort app/ --check-only
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        npx playwright install

    - name: Start services with Docker Compose
      run: |
        docker compose up -d
        docker compose exec -T web python manage.py migrate
        docker compose exec -T web python manage.py seed_catalog

    - name: Run E2E tests
      run: |
        cd frontend
        npx playwright test
      continue-on-error: true

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/

    - name: Stop services
      if: always()
      run: docker compose down

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: bandit -r app/ -ll
      continue-on-error: true

    - name: Check for known vulnerabilities
      run: safety check
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker images
      run: |
        docker compose build
        docker compose -f compose.prod.yml build

    - name: Test production image
      run: docker compose -f compose.prod.yml config

  notify:
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-lint, frontend-build]
    if: always()
    steps:
    - name: Determine status
      run: |
        if [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
           [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
          echo "❌ Pipeline failed"
        else
          echo "✅ Pipeline succeeded"
        fi
